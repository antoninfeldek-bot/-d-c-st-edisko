<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Krizový štáb</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Saira+Condensed:wght@500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><span data-i18n="brand">Krizový štáb</span><small id="scenName">Situation Room · Washington</small></div>
    <div class="stat clock"><label id="dayLbl">Den 1</label><div class="v" id="clock">03:00</div><small id="hLeft"></small></div>
    <div class="stat"><label>DEFCON</label><div class="defcon" id="defcon"><span data-l="5">5</span><span data-l="4">4</span><span data-l="3">3</span><span data-l="2">2</span><span data-l="1">1</span></div></div>
    <div class="meters" id="meters"></div>
    <div class="stat pk"><label data-i18n="capital">Politický kapitál</label><div class="v" id="pkVal">0</div></div>
    <div class="ctrl">
      <button class="btn" id="bPause" data-i18n="pause" data-i18n-title="pauseTip">Pauza</button>
      <button class="btn spd on" data-s="1">1×</button>
      <button class="btn spd" data-s="2">2×</button>
      <button class="btn spd" data-s="4">4×</button>
      <button class="btn" id="bAuto" data-i18n-title="autoTip">Auto-pauza</button>
      <button class="btn" id="bSound" data-i18n="sound">Zvuk: zap</button>
      <button class="btn" id="bLang" data-i18n-title="langTip">EN</button>
    </div>
  </header>

  <div class="main">
    <section class="panel" aria-labelledby="inboxH">
      <h2 id="inboxH"><span data-i18n="inbox">Depeše</span> <span id="inboxCount"></span></h2>
      <div class="list" id="inbox"></div>
    </section>

    <section class="panel center" id="center" aria-live="polite"></section>

    <section class="panel" aria-labelledby="worldH">
      <h2 id="worldH"><span data-i18n="world">Státy</span> <button class="linkbtn" data-view="overview" data-i18n="overview">Přehled</button></h2>
      <div id="world"></div>
    </section>
  </div>

  <section class="logwrap" data-i18n-aria="logAria"><ol class="log" id="log"></ol></section>
</div>

<!-- start / end screen -->
<div class="ovl" id="ovl">
  <div class="brief" id="brief">
    <p class="eyebrow" data-i18n="eyebrow">Bílý dům · Situation Room · Tajné</p>
    <h1 data-i18n="brand">Krizový štáb</h1>
    <p data-i18n="intro"></p>
    <div class="pick">
      <h3 data-i18n="language">Jazyk</h3>
      <div class="opts row2" id="langOpts">
        <button type="button" class="btn optcard" data-lang="cs"><b>Čeština</b></button>
        <button type="button" class="btn optcard" data-lang="en"><b>English</b></button>
      </div>
      <h3 data-i18n="scenario">Scénář</h3>
      <div class="opts" id="scenOpts"></div>
      <h3 data-i18n="difficulty">Obtížnost</h3>
      <div class="opts" id="diffOpts"></div>
    </div>
    <details class="rules-wrap">
      <summary data-i18n="howto">Jak hrát</summary>
      <ul class="rules" data-i18n-html="rules"></ul>
    </details>
    <button class="btn primary" id="startBtn" data-i18n="take">Převzít krizový štáb</button>
    <div id="scoresStart"></div>
    <p class="fine" data-i18n="fine"></p>
  </div>
</div>

<script src="js/util.js"></script>
<script src="js/i18n.js"></script>
<script src="js/data.js"></script>
<script src="js/content.js"></script>
<script src="js/audio.js"></script>
<script src="js/sim.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
